# clock_sync.yaml
#
# ESPHome package: periodic BLE time sync for Xiaomi LYWSD02 / MHO-C303
#
# Required substitutions in your config:
#   clock_mac: "AA:BB:CC:DD:EE:FF"
#
# Required in your config (not included here to avoid conflicts):
#   esp32_ble_tracker:
#     scan_parameters:
#       active: true   # required for ble_client to find the device
#   time:
#     - platform: sntp
#       id: sntp_time
#       ...

ble_client:
  - mac_address: ${clock_mac}
    id: xiaomi_clock_ble
    on_connect:
      then:
        - delay: 3s
        - ble_client.ble_write:
            id: xiaomi_clock_ble
            service_uuid: "ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6"
            characteristic_uuid: "ebe0ccb7-7a0a-4b0c-8a1a-6ff2997da3a6"
            value: !lambda |-
              auto t = id(sntp_time).utcnow();
              uint8_t tz = 3;
              return {(uint8_t)t.timestamp, (uint8_t)(t.timestamp>>8),
                      (uint8_t)(t.timestamp>>16), (uint8_t)(t.timestamp>>24), tz};
        - switch.turn_off: xiaomi_clock_ble_connection

switch:
  - platform: ble_client
    ble_client_id: xiaomi_clock_ble
    id: xiaomi_clock_ble_connection
    internal: true
    restore_mode: ALWAYS_OFF

interval:
  - interval: 24h
    then:
      - switch.turn_on: xiaomi_clock_ble_connection

button:
  - platform: template
    name: "Sync Clock Now"
    on_press:
      - switch.turn_on: xiaomi_clock_ble_connection
