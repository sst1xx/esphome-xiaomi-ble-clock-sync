substitutions:
  clock_mac: "AA:BB:CC:DD:EE:FF"   # Replace with your device MAC address

packages:
  clock_sync: github://sst1xx/esphome-xiaomi-ble-clock-sync/clock_sync.yaml@main

esphome:
  name: my-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true   # required for ble_client to find the device

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Moscow
